<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Surf Finder</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
         background: linear-gradient(135deg, #0b2545 0%, #13607c 60%, #19a0a8 100%); color: #fff; }
  .card { text-align: center; padding: 40px 32px; max-width: 420px; }
  .logo { font-size: 56px; }
  h1 { margin: 8px 0 4px; font-size: 32px; letter-spacing: -0.5px; }
  p { opacity: .85; line-height: 1.5; }
  a { color: #fff; font-weight: 600; }
  .spin { width: 28px; height: 28px; margin: 20px auto 0; border: 3px solid rgba(255,255,255,.3);
          border-top-color: #fff; border-radius: 50%; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🏄</div>
  <h1>Surf Finder</h1>
  <p id="msg">Opening the app…</p>
  <div class="spin" id="spin"></div>
</div>
<script>
  // url.json is rewritten automatically each time the app's tunnel restarts.
  fetch("url.json?t=" + Date.now(), { cache: "no-store" })
    .then(r => r.json())
    .then(d => {
      if (!d.url) throw new Error("no url");
      location.replace(d.url);
    })
    .catch(() => {
      document.getElementById("spin").remove();
      document.getElementById("msg").textContent =
        "The app is offline right now (its host computer is asleep or restarting). Please try again later.";
    });
</script>
</body>
</html>
